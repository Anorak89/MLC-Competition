<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings | BCA Bus Routing Challenge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --cream: #f5f0e8;
            --ink: #1a1714;
            --muted: #7a7168;
            --accent: #c84b2f;
            --rule: #d8d1c4;

            --mono: 'DM Mono', monospace;
            --serif: 'DM Serif Display', serif;
            --sans: 'DM Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--sans);
            background: var(--cream);
            color: var(--ink);
            font-size: 16px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 3rem;
            background: rgba(245, 240, 232, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--rule);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-family: var(--mono);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            color: var(--ink);
            font-weight: 500;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--ink);
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8rem 3rem 4rem;
            text-align: center;
        }

        h1 {
            font-family: var(--serif);
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 400;
            margin-bottom: 1rem;
        }

        p {
            color: var(--muted);
            max-width: 600px;
            margin: 0 auto;
            font-size: 1.1rem;
        }

        .leaderboard-placeholder {
            margin-top: 4rem;
            width: 100%;
            max-width: 800px;
            border: 1px dashed var(--muted);
            padding: 4rem;
            border-radius: 8px;
            background: rgba(26, 23, 20, 0.02);
            font-family: var(--mono);
            color: var(--muted);
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
            }

            .nav-links {
                display: none;
            }

            .container {
                padding: 6rem 1.5rem 3rem;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html" class="nav-logo">
            <span>BCA Bus Routing Challenge</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html#problem">Problem</a></li>
            <li><a href="index.html#details">Details</a></li>
            <li><a href="simulator.html" style="color:#c84b2f">Simulator</a></li>
            <li><a href="standings.html">Standings</a></li>
            <li><a href="index.html#sponsors">Sponsors</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Coming Soon</h1>
        <p>The competition leaderboard will be available here once the dataset is officially launched and the
            competition begins on Kaggle.</p>

        <div class="leaderboard-placeholder">
            [ Live Kaggle Leaderboard Stats Will Appear Here ]
        </div>
    </div>
</body>

</html>
