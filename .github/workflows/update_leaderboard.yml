name: Update Leaderboard

on:
  schedule:
    - cron: '*/30 12-23,0-3 * * *' # Runs every 30 minutes from 8 AM to 11 PM EDT
  workflow_dispatch: # Allows manual trigger

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch Codabench Data
        run: python tools/update_leaderboard.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json
          git commit -m "Auto-update leaderboard data" || echo "No changes to commit"
          git push
