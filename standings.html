<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings | BCA Bus Routing Challenge</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg" />
    <meta property="og:image" content="logo.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --cream: #f5f0e8;
            --ink: #1a1714;
            --muted: #7a7168;
            --accent: #c84b2f;
            --rule: #d8d1c4;

            --mono: 'DM Mono', monospace;
            --serif: 'DM Serif Display', serif;
            --sans: 'DM Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--sans);
            background: var(--cream);
            color: var(--ink);
            font-size: 16px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 3rem;
            background: rgba(245, 240, 232, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--rule);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-family: var(--mono);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            color: var(--ink);
            font-weight: 500;
            text-decoration: none;
        }

        .logo {
            width: 54px;
            height: 54px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: var(--ink);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
        }

        .mobile-menu-btn span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--ink);
            margin-bottom: 5px;
            transition: 0.3s;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8rem 3rem 4rem;
            text-align: center;
        }

        h1 {
            font-family: var(--serif);
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 400;
            margin-bottom: 1rem;
        }

        p {
            color: var(--muted);
            max-width: 600px;
            margin: 0 auto;
            font-size: 1.1rem;
        }

        .leaderboard-container {
            margin-top: 4rem;
            width: 100%;
            max-width: 900px;
            background: white;
            border: 1px solid var(--rule);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .leaderboard-table th:first-child { border-top-left-radius: 8px; }
        .leaderboard-table th:last-child { border-top-right-radius: 8px; }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .leaderboard-table th,
        .leaderboard-table td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--rule);
        }

        .leaderboard-table th {
            background: rgba(245, 240, 232, 0.5);
            font-family: var(--mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            font-weight: 500;
        }

        .leaderboard-table td {
            font-size: 1.05rem;
        }

        .leaderboard-table tbody tr:last-child td {
            border-bottom: none;
        }

        .leaderboard-table tbody tr:hover {
            background: rgba(245, 240, 232, 0.3);
        }

        .rank-col {
            font-family: var(--mono);
            color: var(--muted);
            font-weight: 500;
            width: 80px;
        }

        .user-col {
            font-weight: 500;
            color: var(--ink);
        }

        .score-col {
            font-family: var(--mono);
            font-weight: 500;
            color: var(--accent);
        }

        .metric-col {
            font-family: var(--mono);
            color: var(--muted);
        }

        .controls-right {
            display: flex;
            gap: 1rem;
        }

        .leaderboard-footer {
            width: 100%;
            max-width: 900px;
            margin-top: 1rem;
            text-align: right;
        }

        .update-text {
            font-family: var(--mono);
            color: var(--muted);
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                text-align: center;
                gap: 1.5rem;
                padding-top: 1.5rem;
                padding-bottom: 1rem;
                border-bottom: none;
                position: static;
                background: transparent;
            }

            .nav-links.active {
                display: flex;
            }

            .mobile-menu-btn {
                display: block;
            }

            .container {
                padding: 6rem 1.5rem 3rem;
            }

            .leaderboard-table th,
            .leaderboard-table td {
                padding: 0.75rem 1rem;
            }
        }

        .leaderboard-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin-top: 3rem;
            margin-bottom: 1rem;
        }

        .phase-title {
            font-family: var(--serif);
            font-size: 1.8rem;
            color: var(--ink);
            margin: 0;
        }

        .btn {
            font-family: var(--sans);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: var(--ink);
            color: var(--cream);
        }

        .btn-primary:hover {
            background: var(--accent);
        }

        .btn-secondary {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--rule);
        }

        .btn-secondary:hover {
            background: rgba(26, 23, 20, 0.05);
        }

        .search-input {
            font-family: var(--sans);
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border: 1px solid var(--rule);
            border-radius: 4px;
            outline: none;
            width: 200px;
            background: white;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--ink);
        }

        .pagination-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--rule);
            background: rgba(245, 240, 232, 0.95);
            backdrop-filter: blur(5px);
            position: sticky;
            bottom: 0;
            z-index: 10;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .page-info {
            font-family: var(--mono);
            font-size: 0.85rem;
            color: var(--muted);
        }

        .btn-page {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        .btn-page:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: transparent;
        }
    </style>
</head>

<body>
    <nav>
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="nav-logo" style="cursor: pointer;" onclick="window.location.href='index.html'">
                <img src="bca-logo.png" alt="BCA Logo" class="logo" onerror="this.style.display='none'">
                <span>Project OmniBus</span>
            </div>
            
            <button class="mobile-menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('active')">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <ul class="nav-links">
            <li><a href="https://www.codabench.org/competitions/16945/" target="_blank" rel="noopener noreferrer" style="color:var(--accent); font-weight: 500;">Competition ↗</a></li>
            <li><a href="index.html#opening-ceremony">Kickoff</a></li>
            <li><a href="index.html#sponsors">Sponsors</a></li>
            <li><a href="information.html">Information</a></li>
            <li><a href="index.html#simulator">Simulator</a></li>
            <li><a href="standings.html">Standings</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Leaderboard</h1>
        <p>Live rankings for the BCA Bus Routing Challenge on <a href="https://www.codabench.org/competitions/16945/#/results-tab" target="_blank" rel="noopener noreferrer" style="color: var(--accent); text-decoration: none; font-weight: 500;">Codabench</a>.</p>

        <div class="leaderboard-controls">
            <h2 id="phase-title" class="phase-title">Final Phase</h2>
            <div class="controls-right">
                <input type="text" id="search-input" class="search-input" placeholder="Search users..." />
                <button id="show-final-btn" class="btn btn-secondary" style="display: none;">Show Final Leaderboard</button>
            </div>
        </div>

        <div class="leaderboard-container" style="margin-top: 0;">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>User</th>
                        <th>Score</th>
                        <th>Mean Reward</th>
                        <th>Episodes</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 3rem; font-family: var(--mono); color: var(--muted);">
                            Loading leaderboard data...
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination-controls" id="pagination-controls" style="display: none;">
                <button id="prev-page-btn" class="btn btn-secondary btn-page">Previous</button>
                <div id="page-info" class="page-info">Page 1 of 1</div>
                <button id="next-page-btn" class="btn btn-secondary btn-page">Next</button>
            </div>
        </div>

        <div class="leaderboard-footer">
            <div id="last-updated-text" class="update-text"></div>
        </div>
    </div>

    <script>
        const FINAL_PHASE = "28294";
        const DEV_PHASE = "28293";
        const ITEMS_PER_PAGE = 10;
        
        let cachedData = null;
        let currentPhaseSubmissions = [];
        let currentPage = 1;
        let searchQuery = "";
        let currentEmptyMessage = "No submissions yet.";

        async function fetchLeaderboardData() {
            if (cachedData) return cachedData;
            const response = await fetch('data/leaderboard.json');
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            cachedData = await response.json();
            return cachedData;
        }

        function applyFiltersAndPaginate() {
            const tbody = document.getElementById('leaderboard-body');
            const paginationControls = document.getElementById('pagination-controls');
            tbody.innerHTML = '';

            let filtered = currentPhaseSubmissions;
            
            if (searchQuery) {
                const lowerQuery = searchQuery.toLowerCase();
                filtered = filtered.filter(sub => sub.owner.toLowerCase().includes(lowerQuery));
            }

            if (filtered.length === 0) {
                const msg = searchQuery ? "No users found matching your search." : currentEmptyMessage;
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 3rem; font-family: var(--mono); color: var(--muted);">${msg}</td></tr>`;
                paginationControls.style.display = 'none';
                return;
            }

            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const paginated = filtered.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            if (totalPages <= 1) {
                paginationControls.style.display = 'none';
            } else {
                paginationControls.style.display = 'flex';
                document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
                document.getElementById('prev-page-btn').disabled = currentPage === 1;
                document.getElementById('next-page-btn').disabled = currentPage === totalPages;
            }

            paginated.forEach((sub) => {
                const row = document.createElement('tr');
                
                let score = '-';
                let meanReward = '-';
                let episodes = '-';

                if (sub.scores) {
                    const scoreObj = sub.scores.find(s => s.column_key === 'score');
                    const meanRewardObj = sub.scores.find(s => s.column_key === 'mean_reward');
                    const episodesObj = sub.scores.find(s => s.column_key === 'episodes');

                    if (scoreObj) score = parseFloat(scoreObj.score).toFixed(2);
                    if (meanRewardObj) meanReward = parseFloat(meanRewardObj.score).toFixed(2);
                    if (episodesObj) episodes = parseInt(episodesObj.score, 10);
                }

                row.innerHTML = `
                    <td class="rank-col">#${sub.globalRank}</td>
                    <td class="user-col">${sub.owner}</td>
                    <td class="score-col">${score}</td>
                    <td class="metric-col">${meanReward}</td>
                    <td class="metric-col">${episodes}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function loadPhaseData(phaseData, emptyMessage) {
            currentEmptyMessage = emptyMessage;
            if (!phaseData || !phaseData.submissions || phaseData.submissions.length === 0) {
                currentPhaseSubmissions = [];
            } else {
                currentPhaseSubmissions = phaseData.submissions.map((sub, index) => {
                    sub.globalRank = index + 1;
                    return sub;
                });
            }
            currentPage = 1;
            applyFiltersAndPaginate();
        }

        function setLoadingState() {
            const tbody = document.getElementById('leaderboard-body');
            document.getElementById('pagination-controls').style.display = 'none';
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 3rem; font-family: var(--mono); color: var(--muted);">Loading leaderboard data...</td></tr>';
        }

        function updateUI(phase, lastUpdatedIso) {
            const phaseTitle = document.getElementById('phase-title');
            const showFinalBtn = document.getElementById('show-final-btn');
            const lastUpdatedText = document.getElementById('last-updated-text');

            if (phase === FINAL_PHASE) {
                phaseTitle.textContent = "Final Phase";
                showFinalBtn.style.display = 'none';
            } else {
                phaseTitle.textContent = "Development Phase";
                showFinalBtn.style.display = 'block';
            }

            if (lastUpdatedIso) {
                const date = new Date(lastUpdatedIso);
                const now = new Date();
                const timeString = date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

                if (date.toDateString() === now.toDateString()) {
                    lastUpdatedText.textContent = `Last update: ${timeString}`;
                } else {
                    const yesterday = new Date(now);
                    yesterday.setDate(now.getDate() - 1);
                    
                    if (date.toDateString() === yesterday.toDateString()) {
                        lastUpdatedText.textContent = `Last update: Yesterday at ${timeString}`;
                    } else {
                        const dateString = date.toLocaleDateString([], { month: 'short', day: 'numeric' });
                        lastUpdatedText.textContent = `Last update: ${dateString} at ${timeString}`;
                    }
                }
            }
        }

        async function loadLeaderboard(forcePhase = null) {
            setLoadingState();
            
            try {
                const data = await fetchLeaderboardData();
                const lastUpdated = data.last_updated;

                if (forcePhase === FINAL_PHASE) {
                    const finalData = data[FINAL_PHASE];
                    updateUI(FINAL_PHASE, lastUpdated);
                    loadPhaseData(finalData, "No submissions yet in the Final phase.");
                    return;
                }

                // Initial page load logic: Try Final first
                const finalData = data[FINAL_PHASE];
                
                if (finalData && finalData.submissions && finalData.submissions.length > 0) {
                    updateUI(FINAL_PHASE, lastUpdated);
                    loadPhaseData(finalData, "No submissions yet.");
                } else {
                    // Final is empty, try Development
                    const devData = data[DEV_PHASE];
                    
                    if (devData && devData.submissions && devData.submissions.length > 0) {
                        updateUI(DEV_PHASE, lastUpdated);
                        loadPhaseData(devData, "No submissions yet.");
                    } else {
                        // Both are empty
                        updateUI(FINAL_PHASE, lastUpdated);
                        loadPhaseData(finalData, "No submissions yet in the Final phase.");
                    }
                }

            } catch (error) {
                console.error('Error loading leaderboard:', error);
                const tbody = document.getElementById('leaderboard-body');
                document.getElementById('pagination-controls').style.display = 'none';
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 3rem; font-family: var(--mono); color: var(--accent);">Failed to load leaderboard data. Please try again later.</td></tr>';
            }
        }

        // Event Listeners
        document.getElementById('show-final-btn').addEventListener('click', () => {
            searchQuery = "";
            document.getElementById('search-input').value = "";
            loadLeaderboard(FINAL_PHASE);
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            currentPage = 1;
            applyFiltersAndPaginate();
        });

        document.getElementById('prev-page-btn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                applyFiltersAndPaginate();
            }
        });

        document.getElementById('next-page-btn').addEventListener('click', () => {
            currentPage++;
            applyFiltersAndPaginate();
        });

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', () => loadLeaderboard());
    </script>
</body>

</html>
